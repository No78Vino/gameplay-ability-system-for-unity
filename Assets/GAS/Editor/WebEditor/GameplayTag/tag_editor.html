<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EX-GAS GameplayTag 编辑器</title>
    <link rel="stylesheet" href="tag_editor.css">
</head>
<body>

<header>
    <h1>🏷 EX-GAS GameplayTag 编辑器</h1>
    <span id="xlsx-path">加载中...</span>
    <button class="btn btn-success" onclick="App.addTag()">＋ 新增 Tag</button>
    <button class="btn btn-primary" onclick="App.reload()">↺ 刷新</button>
</header>

<main>
    <div id="tree-panel">
        <div id="tree-toolbar">
            <input id="search" type="text" placeholder="搜索 Tag..." oninput="App.onSearch(this.value)">
        </div>
        <div id="tree"></div>
    </div>
    <div id="form-panel">
        <div id="form-header">
            <h2 id="form-title">请从左侧选择一个 Tag</h2>
            <button class="btn btn-warn btn-sm" id="btn-delete" style="display:none" onclick="App.deleteSelected()">🗑 删除</button>
            <button class="btn btn-primary btn-sm" id="btn-save" style="display:none" onclick="App.saveSelected()">💾 保存</button>
        </div>
        <div id="form-body" class="empty-hint">← 从左侧选择一个 Tag 进行编辑</div>
    </div>
</main>

<div id="statusbar">
    <span id="status-msg">就绪</span>
    <span id="status-count"></span>
</div>

<!-- 新增 Tag 对话框 -->
<div id="modal-overlay">
    <div id="modal">
        <h3>新增 Tag</h3>
        <div class="field-group">
            <label>ID <small>（留空则自动生成）</small></label>
            <input id="modal-id" type="number" placeholder="自动生成">
        </div>
        
        <div class="field-group">
            <label>Tag 名称 <small>（点分层级，如 State.Debuff.Stun）</small></label>
            <input id="modal-name" type="text" placeholder="State.Debuff.Stun" autocomplete="off">
        </div>

        <div class="field-group">
            <label>描述</label>
            <textarea id="modal-desc" placeholder="可选描述"></textarea>
        </div>
        
        <div id="modal-actions">
            <button class="btn btn-neutral" onclick="App.closeModal()">取消</button>
            <button class="btn btn-success" onclick="App.confirmAdd()">确认新增</button>
        </div>
    </div>
</div>

<script src="tag_editor.js"></script>
</body>
</html>
