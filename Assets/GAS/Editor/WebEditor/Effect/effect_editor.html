<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EX-GAS GameplayEffect 编辑器</title>
    <link rel="stylesheet" href="effect_editor.css">
</head>
<body>

<header>
    <h1>🎮 EX-GAS GameplayEffect 编辑器</h1>
    <span id="xlsx-path">加载中...</span>
    <button class="btn btn-success" onclick="App.addEffect()">＋ 新增Effect</button>
    <button class="btn btn-primary" onclick="App.reload()">↺ 刷新</button>
</header>

<main>
    <div id="list-panel">
        <div id="list-toolbar">
            <input id="search" type="text" placeholder="搜索Effect..." oninput="App.onSearch(this.value)">
        </div>
        <div id="effect-list"></div>
    </div>
    <div id="form-panel">
        <div id="form-header">
            <h2 id="form-title">请从左侧选择一个Effect</h2>
            <button class="btn btn-warn btn-sm" id="btn-delete" style="display:none" onclick="App.deleteSelected()">🗑 删除</button>
            <button class="btn btn-primary btn-sm" id="btn-save" style="display:none" onclick="App.saveSelected()">💾 保存</button>
        </div>
        <div id="form-body" class="empty-hint">← 从左侧选择一个Effect进行编辑</div>
    </div>
</main>

<div id="statusbar">
    <span id="status-msg">就绪</span>
    <span id="status-count"></span>
</div>

<!-- 新增Effect对话框 -->
<!-- ✅ 修复：去掉 inline style="display:none"，改用 CSS class 控制 -->
<div id="modal-overlay">
    <div id="modal">
        <h3>新增 GameplayEffect</h3>
        <div class="field-group">
            <label>ID <small>（留空则自动生成）</small></label>
            <input id="modal-id" type="number" placeholder="自动生成">
        </div>
        <div class="field-group">
            <label>Effect名称</label>
            <input id="modal-name" type="text" placeholder="Buff_DamageUp" autocomplete="off">
        </div>
        <div class="field-group">
            <label>描述</label>
            <textarea id="modal-desc" placeholder="可选描述"></textarea>
        </div>
        <div id="modal-actions">
            <button class="btn btn-neutral" onclick="App.closeModal()">取消</button>
            <button class="btn btn-success" onclick="App.confirmAdd()">确认新增</button>
        </div>
    </div>
</div>

<script src="effect_editor.js"></script>
</body>
</html>
